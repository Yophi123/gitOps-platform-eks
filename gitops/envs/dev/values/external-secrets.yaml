installCRDs: true

# Controller
nodeSelector:
  node-pool: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

# Webhook and cert controller have their own scheduling settings
webhook:
  nodeSelector:
    node-pool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

certController:
  nodeSelector:
    node-pool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists