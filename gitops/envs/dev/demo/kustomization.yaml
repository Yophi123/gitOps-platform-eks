apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/demo
patches:
  - target:
      kind: VaultDynamicSecret
      name: demo-db
    patch: |-
      - op: replace
        path: /spec/provider/server
        value: https://gitops-eks-dev-vault-nlb-da6c47de8c8eda11.elb.ap-southeast-1.amazonaws.com:8200
      - op: replace
        path: /spec/provider/caBundle
        value: 
  - target:
      kind: ExternalSecret
      name: demo-db
    patch: |-
      - op: replace
        path: /spec/target/template/data/DB_HOST
        value: gitops-eks-dev-app.c1egw6m2cumy.ap-southeast-1.rds.amazonaws.com