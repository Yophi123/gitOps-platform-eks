apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  # No resources-finalizer: deleting this Application must never remove the CNI
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.2
      helm:
        releaseName: cilium # must match the Terraform bootstrap release
        valueFiles:
          - $values/gitops/envs/dev/values/cilium.yaml
    - repoURL: https://github.com/Yophi123/gitOps-platform-eks.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true