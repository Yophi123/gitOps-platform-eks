# Check Source Repos before applying...
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Cluster platform components (CNI, autoscaling, GitOps)
  sourceRepos:
    - https://github.com/Yophi123/gitOps-platform-eks.git
    - https://helm.cilium.io
    - public.ecr.aws/karpenter
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"