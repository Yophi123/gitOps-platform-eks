apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.15.0
      helm:
        releaseName: karpenter
        skipCrds: true # owned by the karpenter-crd Application
        valueFiles:
          - $values/gitops/envs/dev/values/karpenter.yaml
    - repoURL: https://github.com/Yophi123/gitOps-platform-eks.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
