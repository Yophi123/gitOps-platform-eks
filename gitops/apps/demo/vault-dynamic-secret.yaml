apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: demo-db
  namespace: demo
spec:
  path: /database/creds/demo
  method: GET
  resultType: Data # username + password from the lease data
  provider:
    server: https://gitops-eks-dev-vault-nlb-da6c47de8c8eda11.elb.ap-southeast-1.amazonaws.com:8200 # patched per environment
    caBundle:  # patched per environment (base64 PEM)
    auth:
      jwt:
        path: jwt-eks
        role: demo
        kubernetesServiceAccountToken:
          serviceAccountRef:
            name: demo-app
          audiences:
            - vault