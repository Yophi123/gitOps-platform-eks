apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-db
  namespace: demo
spec:
  refreshInterval: 30m # new lease well before the 1h TTL
  target:
    name: demo-db
    template:
      engineVersion: v2
      mergePolicy: Merge # keep generated username/password, add the fields below
      data:
        DB_HOST: gitops-eks-dev-app.c1egw6m2cumy.ap-southeast-1.rds.amazonaws.com% # patched per environment
        DB_NAME: app
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: demo-db