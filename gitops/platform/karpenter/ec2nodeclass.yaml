apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: gitops-eks-dev-karpenter-node # terraform output karpenter_node_role_name

  # Pin a version in prod (al2023@vYYYYMMDD) so AMI rollouts are deliberate
  amiSelectorTerms:
    - alias: al2023@latest

  # App tier only: the karpenter.sh/discovery tag is on app subnets
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-eks-dev
  # EKS cluster SG (tagged by the eks module); Cilium's pod ENIs inherit it
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-eks-dev

  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1 # pods can't reach node credentials

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: gitops-eks
    ManagedBy: karpenter