# Base EC2NodeClass. Environment-specific names are placeholders
# (CLUSTER_NAME); each gitops/envs/<env>/karpenter-nodes overlay patches them.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: CLUSTER_NAME-karpenter-node # patched: terraform output karpenter_node_role_name

  # Pin a version in prod (al2023@vYYYYMMDD) so AMI rollouts are deliberate.
  # The alias resolves per architecture, so amd64 and arm64 nodes both work.
  amiSelectorTerms:
    - alias: al2023@latest

  # App tier only: the karpenter.sh/discovery tag is on the app subnets
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: CLUSTER_NAME # patched
  # EKS cluster SG (tagged by the eks module); Cilium's pod ENIs inherit it
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: CLUSTER_NAME # patched

  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1 # pods can't reach node credentials

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: gitops-eks
    ManagedBy: karpenter