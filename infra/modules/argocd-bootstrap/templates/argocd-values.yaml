# Bootstrap copy. After stage 3, gitops/envs/<env>/values/argocd.yaml is the
# source of truth (Argo CD manages itself). Keep them identical.

# Platform components live on the dedicated system nodes
global:
  nodeSelector:
    node-pool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# The redis secret-init hook Job doesn't inherit global scheduling settings.
# It runs pre-install, so without this the whole install waits on it.
redisSecretInit:
  nodeSelector:
    node-pool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

configs:
  params:
    server.insecure: true # no ingress yet; reached via port-forward
  cm:
    timeout.reconciliation: 180s
    # Make sync waves wait for child Applications to be Healthy (app-of-apps)
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  repositories:
    # Karpenter's charts are OCI artifacts on public ECR
    karpenter-oci:
      name: karpenter
      type: helm
      url: public.ecr.aws/karpenter
      enableOCI: "true"

dex:
  enabled: false
notifications:
  enabled: false # revisit in stage 6